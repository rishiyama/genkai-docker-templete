[project]
name = "my_env"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy<2",
  "scipy",
  "transformers",
  "wandb<0.23",
  "natsort",
  "cairosvg",
  "requests",
  "urllib3",
  "protobuf<=3.20",
  "svgpathtools",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchaudio==2.7.1",
  "omegaconf>=2.3.0",
  "ruff>=0.14.7",
  "ipykernel>=7.1.0",
  "matplotlib>=3.10.7",
  "diffusers>=0.36.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
